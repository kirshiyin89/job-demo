apiVersion: batch/v1
kind: Job
metadata:
  name: ttl-test-job
  namespace: default
  annotations:
    argocd.argoproj.io/hook: PostSync
    argocd.argoproj.io/hook-delete-policy: HookSucceeded
spec:
  ttlSecondsAfterFinished: 60
  template:
    spec:
      restartPolicy: Never
      containers:
        - name: test
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              echo "Job started"
              sleep 10
              echo "Job finished"
